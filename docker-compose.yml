services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before running Docker Compose}"
      POSTGRES_DB: ${DB_NAME:-nmapdb}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - nmap-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before running Docker Compose}"
      DB_NAME: ${DB_NAME:-nmapdb}
      DB_SSLMODE: disable
      WORKER_COUNT: 4
      MAX_BATCH_SIZE: 20
      DEFAULT_TIMEOUT_SECONDS: 120
      SCAN_ALLOWED_TARGETS: ${SCAN_ALLOWED_TARGETS:-}
      APP_ENV: development
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - api
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

volumes:
  postgres_data:
  prometheus_data:
